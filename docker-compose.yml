services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: control_plane
      POSTGRES_USER: control
      POSTGRES_PASSWORD: control
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control -d control_plane"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: control_plane_test
      POSTGRES_USER: control
      POSTGRES_PASSWORD: control
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control -d control_plane_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://control:control@postgres:5432/control_plane
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      postgres-test: {condition: service_healthy}

  worker:
    build: .
    command: ["python", "-m", "worker.simulator", "--fail-rate", "${WORKER_FAIL_RATE:-0}", "--min-delay-ms", "${WORKER_MIN_DELAY_MS:-300}", "--max-delay-ms", "${WORKER_MAX_DELAY_MS:-1200}"]
    environment:
      DATABASE_URL: postgresql+psycopg://control:control@postgres:5432/control_plane
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
    depends_on:
      rabbitmq: {condition: service_healthy}
      api: {condition: service_started}

volumes:
  postgres_data:
  postgres_test_data:
