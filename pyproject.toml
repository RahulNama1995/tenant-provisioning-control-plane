[project]
name = "tenant-control-plane"
version = "1.0.0"
description = "Asynchronous multi-tenant provisioning control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pydantic>=2.8,<3", "pika>=1.3,<2",
  "tenacity>=9,<10", "python-json-logger>=2,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1", "pytest-cov>=5,<7", "bandit>=1.7,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
[tool.setuptools.packages.find]
include = ["app*", "worker*"]